[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evobrain"
version = "0.1.0"
description = "EvoBrain cognitive infrastructure"
readme = "README.en.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/giga-labor/EvolutionBrain"
Repository = "https://github.com/giga-labor/EvolutionBrain"
Issues = "https://github.com/giga-labor/EvolutionBrain/issues"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "data*", "directive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
