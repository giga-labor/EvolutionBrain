name: Feature Request
description: Proponi una nuova funzionalita
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema da risolvere
      description: Qual e il bisogno reale?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Come dovrebbe funzionare?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative considerate
