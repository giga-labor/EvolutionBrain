name: Bug Report
description: Segnala un malfunzionamento
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Descrizione
      description: Cosa non funziona?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passi per riprodurre
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Risultato atteso
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Ambiente
      description: OS, Python version, branch/commit
